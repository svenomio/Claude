<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Betriebsrat – Das Glücksrad der Organisation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🎡 Betriebsrat</h1>
      <p class="subtitle">Das Glücksrad der Organisation</p>
      <button class="reset-btn" id="resetBtn" title="Organigramm zurücksetzen">Zurücksetzen</button>
    </header>

    <div class="event-banner" id="eventBanner" hidden>
      <span class="event-tier" id="eventTier"></span>
      <p class="event-text" id="eventText"></p>
    </div>

    <main class="layout">
      <section class="wheel-section">
        <div class="wheel-wrap" id="wheelWrap">
          <div class="wheel-pointer">▼</div>
          <div class="wheel" id="wheel"></div>
          <div class="wheel-hint" id="wheelHint">Wischen zum Drehen</div>
        </div>
        <ul class="legend" id="legend"></ul>
      </section>

      <section class="org-section">
        <div class="org-chart" id="orgChart"></div>
      </section>
    </main>
  </div>

  <script src="orgchart.js"></script>
  <script src="escalation.js"></script>
  <script src="app.js"></script>
</body>
</html>
